<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Etiquetas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zM13 3h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zM18 13h-2v2h2v-2zM13 13h2v2h-2v-2zm2 4h-2v2h2v-2zm2-2h2v2h-2v-2zm0 4h2v-2h-2v2z"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">ETQ.GEN</div>
        <div class="brand-sub">Gerador de Etiquetas</div>
      </div>
    </div>
    <div class="header-tag">v2.0</div>
  </div>

  <!-- Body -->
  <div class="body">

    <div class="label-text">Nome do produto</div>
    <div class="input-wrap">
      <input
        type="text"
        id="nome-input"
        placeholder="ex: Parafuso M8 x 20mm"
        autocomplete="off"
        spellcheck="false"
        onkeydown="if(event.key==='Enter') gerar()"
      />
    </div>

    <button class="btn" id="gerar-btn" onclick="gerar()">
      <span class="btn-text">Gerar Etiqueta</span>
      <span class="btn-loader"></span>
    </button>

    <div class="status" id="status"></div>

    <!-- Divider -->
    <div class="divider" id="divider" style="display:none"></div>

    <!-- Result -->
    <div class="result" id="result">

      <div class="result-row">
        <div class="result-name" id="result-nome">—</div>
        <div class="result-badge">✓ Gerado</div>
      </div>

      <div class="code-block">
        <div>
          <div class="code-label">Código</div>
          <div class="code-value" id="result-code">—</div>
        </div>
        <button class="copy-btn" onclick="copiar()">COPIAR</button>
      </div>

      <div class="qr-wrap">
        <div class="qr-scan-line"></div>
        <img id="qr-img" src="" alt="QR Code" />
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-info">pywebview · python-docx</div>
    <div class="counter">etiquetas: <span id="counter">0</span></div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
